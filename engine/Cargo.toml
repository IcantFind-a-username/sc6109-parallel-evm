[package]
name = "parevm"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "Parallel transaction execution engine for EVM workloads (SC6109 Option 5)"

[dependencies]
dashmap = "6"
mimalloc = { version = "0.1", optional = true }
rand = "0.9"
rand_chacha = "0.9"
rayon = "1"
# PINNED. Do not change without a DECISIONS.md entry. See CLAUDE.md.
revm = "=41.0.0"

[dev-dependencies]

[profile.release]
debug = true      # benchmarks need symbols for profiling

[features]
# D15: mimalloc is an experimental condition. On by default so the sequential
# baseline and every parallel engine always share one allocator; disable with
# --no-default-features to reproduce the system-allocator comparison.
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]
