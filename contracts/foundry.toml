[profile.default]
src = "src"
test = "test"
out = "out"
libs = []
# Pinned, like revm: the engine embeds this compiler's output and a different
# solc would silently change the bytecode being measured.
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
bytecode_hash = "none"
cbor_metadata = false
